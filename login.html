
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login | MCA DepartmentNotice System</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body class="login-page">

    <div class="login-shell">

        <section class="login-brand">
            <span class="brand-label">College Communication Portal</span>

            <h1>MCA Department<br>Notice System</h1>

            <p>
                A central platform for managing college announcements,
                academic updates, events and important circulars.
            </p>
        </section>

        <section class="login-card">

            <h2>Welcome Back</h2>
            <p class="login-subtitle">
                Sign in to access the staff notice dashboard.
            </p>

            <form id="loginForm">

                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your registered email"
                    required
                >

                <label for="password">Password</label>

                <div class="password-wrap">
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        id="togglePassword"
                    >
                        SHOW
                    </button>
                </div>

                <button type="submit" class="login-button">
                    Sign In
                </button>

            </form>

            <p id="message"></p>

            <a href="./index.html" class="login-back">
                ← Back to Student Notice Board
            </a>

        </section>
    </div>

    <script type="module" src="./login.js"></script>

</body>
</html>
